<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler Tin Tức - Dân trí</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-top">
            <div class="logo">
                <a href="index.html">Dân trí<span>.com.vn</span></a>
            </div>
            <a href="index.html" class="btn-back">⬅ Trang chủ</a>
        </div>
    </header>

    <main class="container crawler-container">
        <h2>🛠️ Công cụ Crawler Bài Viết Từ URL Dân Trí</h2>
        <p>Nhập bất kỳ đường dẫn bài viết Dân trí nào để tự động bóc tách dữ liệu JSON & hình ảnh bài viết:</p>
        
        <div class="crawler-form">
            <input type="text" id="crawlUrlInput" placeholder="Ví dụ: https://dantri.com.vn/thoi-su/chinh-tri.htm">
            <button id="crawlBtn">Bóc tách & Lưu vào LocalStorage</button>
        </div>

        <div class="result-box">
            <h3>Object JSON Dữ Liệu Thu Thập Được:</h3>
            <pre id="jsonResult">// Dữ liệu bóc tách sẽ hiển thị ở đây...</pre>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
